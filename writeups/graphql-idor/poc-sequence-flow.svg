<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The attacker calls the scope resolver. If the target user is in the caller's own organization the call is correctly denied. If the target is in a different organization the write is applied with no check and persists on later calls.</desc>
